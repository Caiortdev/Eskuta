name: CI

on:
  # CI roda em todo PR aberto pra main + smoke test pós-merge em main.
  # Branches feature/chore/fix NÃO disparam o workflow direto — pra ver
  # CI nelas, basta abrir o PR (mesmo draft). Isso evita rodar 2x o
  # mesmo CI quando um push aciona simultaneamente `push` + `pull_request`.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigas da mesma branch quando push novo chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Sidecar Python — lint (ruff) + format + tests (pytest)
  # ============================================================
  python-sidecar:
    name: Sidecar Python (lint + test)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src-python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src-python/requirements.txt
            src-python/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff format)
        run: ruff format --check app tests

      - name: Test (pytest + coverage)
        run: pytest

  # ============================================================
  # Frontend — TypeScript + Vitest (com coverage gate)
  # ============================================================
  frontend:
    name: Frontend (typecheck + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (vitest + coverage gate)
        run: npm run test:coverage

      - name: Build (Vite smoke)
        run: npm run build

  # ============================================================
  # Frontend — Lint (ESLint) + Format (Prettier)
  # Separado do typecheck+test pra dar feedback mais rápido.
  # ============================================================
  lint-frontend:
    name: Frontend (lint + format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ============================================================
  # Rust — cargo fmt + clippy (denyando warnings)
  # ============================================================
  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # O build.rs do Tauri lê tauri.conf.json e exige que cada
      # resource glob bata em pelo menos 1 arquivo. Como o sidecar
      # real (--onedir pasta) só é empacotado no job tauri-build
      # (Windows), criamos uma pasta stub com um arquivo dentro pra
      # clippy poder rodar (clippy só faz análise estática).
      - name: Stub sidecar folder (apenas pra clippy aceitar)
        run: |
          mkdir -p src-tauri/binaries/eskuta-sidecar
          echo "stub" > src-tauri/binaries/eskuta-sidecar/eskuta-sidecar.exe
          mkdir -p src-tauri/binaries/eskuta-sidecar/_internal
          echo "stub" > src-tauri/binaries/eskuta-sidecar/_internal/stub.txt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  # ============================================================
  # Auditoria — vulnerabilidades em deps (npm + pip)
  # ============================================================
  security:
    name: Auditoria (npm audit + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (sidecar)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r src-python/requirements.txt

  # ============================================================
  # Pre-commit — roda todos os hooks contra HEAD vs base
  # Garante que ninguém commitou ignorando hooks locais.
  # ============================================================
  pre-commit:
    name: Pre-commit hooks (sanity)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust (pra cargo fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pre-commit + deps de hooks
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          npm ci

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ============================================================
  # Tauri build smoke — Windows runner, debug build.
  # Caro (10+ min), só em PR pra main.
  # ============================================================
  tauri-build:
    name: Tauri build (Windows, smoke)
    runs-on: windows-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src-python/requirements.txt
            src-python/requirements-build.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Install Python deps (runtime + build)
        working-directory: src-python
        run: |
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build sidecar (PyInstaller)
        working-directory: src-python
        run: python build_sidecar.py

      - name: Stage sidecar for Tauri (--onedir folder)
        shell: pwsh
        run: |
          # Com PyInstaller --onedir, src-python/dist/eskuta-sidecar/
          # é uma PASTA com .exe + _internal/. Copia inteira pra
          # src-tauri/binaries/eskuta-sidecar/ (Tauri pega via
          # bundle.resources do tauri.conf.json).
          $src = "src-python/dist/eskuta-sidecar"
          $dst = "src-tauri/binaries/eskuta-sidecar"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path "$src/*" -Destination $dst -Recurse -Force

      - name: Smoke test sidecar empacotado
        shell: pwsh
        run: |
          # Sobe o sidecar empacotado e bate em /health pra validar
          # que o bundle PyInstaller realmente roda em máquina limpa.
          # Path da pasta --onedir: src-python/dist/eskuta-sidecar/eskuta-sidecar.exe
          $sidecar = Start-Process -FilePath "src-python\dist\eskuta-sidecar\eskuta-sidecar.exe" `
                                   -ArgumentList "--host", "127.0.0.1", "--port", "8766" `
                                   -PassThru -WindowStyle Hidden
          try {
              # Espera até 20s pra subir
              $ready = $false
              for ($i = 0; $i -lt 20; $i++) {
                  Start-Sleep -Seconds 1
                  try {
                      $r = Invoke-WebRequest -Uri "http://127.0.0.1:8766/health" -UseBasicParsing -TimeoutSec 2
                      if ($r.StatusCode -eq 200) { $ready = $true; break }
                  } catch {}
              }
              if (-not $ready) {
                  Write-Host "::error::Sidecar empacotado não respondeu em 20s"
                  exit 1
              }
              Write-Host "✓ Sidecar empacotado respondeu /health OK"

              # Bate em /health/detailed também
              $detailed = Invoke-WebRequest -Uri "http://127.0.0.1:8766/health/detailed" -UseBasicParsing
              if ($detailed.StatusCode -ne 200) {
                  Write-Host "::error::/health/detailed falhou ($($detailed.StatusCode))"
                  exit 1
              }
              Write-Host "✓ /health/detailed OK"
          } finally {
              if ($sidecar -and -not $sidecar.HasExited) {
                  Stop-Process -Id $sidecar.Id -Force
              }
          }

      - name: Tauri build (debug, sem assinatura)
        run: npm run tauri build -- --debug

  # ============================================================
  # Cross-platform smoke — apenas valida que Rust + frontend
  # compilam em macOS e Linux. Não builda sidecar PyInstaller
  # nem instalador completo (esses precisam de jobs dedicados
  # por plataforma com tooling nativo).
  # ============================================================
  cross-platform-smoke:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Cargo check (sem sidecar real, stub pra o glob de resources passar)
        working-directory: src-tauri
        shell: bash
        run: |
          # tauri.conf.json tem bundle.resources apontando pra
          # binaries/eskuta-sidecar/**/* — precisa de pelo menos 1
          # arquivo lá pra o build.rs aceitar.
          mkdir -p binaries/eskuta-sidecar/_internal
          echo "stub" > binaries/eskuta-sidecar/eskuta-sidecar.exe
          echo "stub" > binaries/eskuta-sidecar/_internal/stub.txt
          cargo check --all-targets

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        shell: bash
