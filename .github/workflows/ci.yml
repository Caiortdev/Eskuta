name: CI

on:
  push:
    branches: [main, "phase-**"]
  pull_request:
    branches: [main]

# Cancela runs antigas da mesma branch quando push novo chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sidecar:
    name: Sidecar Python (lint + test)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src-python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src-python/requirements.txt
            src-python/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff format)
        run: ruff format --check app tests

      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend (typecheck + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (vitest)
        run: npm run test:coverage

      - name: Build (Vite — smoke)
        run: npm run build

  security:
    name: Auditoria (npm audit + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (sidecar)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r src-python/requirements.txt
