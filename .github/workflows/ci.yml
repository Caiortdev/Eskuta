name: CI

on:
  push:
    branches: [main, "phase-**", "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Cancela runs antigas da mesma branch quando push novo chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Sidecar Python — lint (ruff) + format + tests (pytest)
  # ============================================================
  python-sidecar:
    name: Sidecar Python (lint + test)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src-python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src-python/requirements.txt
            src-python/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff format)
        run: ruff format --check app tests

      - name: Test (pytest + coverage)
        run: pytest

  # ============================================================
  # Frontend — TypeScript + Vitest (com coverage gate)
  # ============================================================
  frontend:
    name: Frontend (typecheck + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (vitest + coverage gate)
        run: npm run test:coverage

      - name: Build (Vite smoke)
        run: npm run build

  # ============================================================
  # Frontend — Lint (ESLint) + Format (Prettier)
  # Separado do typecheck+test pra dar feedback mais rápido.
  # ============================================================
  lint-frontend:
    name: Frontend (lint + format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ============================================================
  # Rust — cargo fmt + clippy (denyando warnings)
  # ============================================================
  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  # ============================================================
  # Auditoria — vulnerabilidades em deps (npm + pip)
  # ============================================================
  security:
    name: Auditoria (npm audit + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (sidecar)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r src-python/requirements.txt

  # ============================================================
  # Pre-commit — roda todos os hooks contra HEAD vs base
  # Garante que ninguém commitou ignorando hooks locais.
  # ============================================================
  pre-commit:
    name: Pre-commit hooks (sanity)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust (pra cargo fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pre-commit + deps de hooks
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          npm ci

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ============================================================
  # Tauri build smoke — Windows runner, debug build.
  # Caro (10+ min), só em PR pra main.
  # ============================================================
  tauri-build:
    name: Tauri build (Windows, smoke)
    runs-on: windows-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src-python/requirements.txt
            src-python/requirements-build.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Install Python deps (runtime + build)
        working-directory: src-python
        run: |
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build sidecar (PyInstaller)
        working-directory: src-python
        run: python build_sidecar.py

      - name: Stage sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item src-python/dist/eskuta-sidecar.exe `
                    src-tauri/binaries/eskuta-sidecar-x86_64-pc-windows-msvc.exe

      - name: Tauri build (debug, sem assinatura)
        run: npm run tauri build -- --debug
