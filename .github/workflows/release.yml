# =============================================================
# Release workflow — dispara em tag v* (ex: v0.1.0, v0.2.0-beta1)
# Builda Windows MSI + NSIS, opcionalmente assina, e publica em
# GitHub Releases como draft.
#
# Secrets necessários (configurar em Settings > Secrets):
#   TAURI_PRIVATE_KEY    — conteúdo do .key gerado por scripts/generate-update-keys.ps1
#   TAURI_KEY_PASSWORD   — senha da chave Ed25519
#
# Pro release ser assinado e o update funcionar, esses secrets DEVEM
# estar configurados. Sem eles, o build ainda gera MSI/NSIS mas sem
# .sig — clientes não conseguem auto-update.
# =============================================================

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pega tags + history pra changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python deps
        run: |
          cd src-python
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          pip install -r requirements.txt -r requirements-build.txt

      - name: Install npm deps
        run: npm ci

      - name: Run build pipeline
        env:
          # Secrets do Tauri — se setados, o build assina automaticamente
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pwsh scripts/build.ps1

      - name: List artifacts
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi, *.exe, *.sig | Format-Table FullName, Length

      - name: Upload artifacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: eskuta-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 14

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
