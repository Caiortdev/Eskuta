[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# basetemp local — evita conflitos de permissão em %TEMP%\pytest-of-* no
# Windows (handles de processos anteriores podem ficar com acesso negado).
# O diretório está no .gitignore da raiz.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--basetemp=.pytest-tmp",
    "--cov=app",
    "--cov=evaluation",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    # Benchmarks (Fase 1.9.5 / Bloco A.4) ficam DESABILITADOS por default
    # — eles só fazem sentido com --benchmark-only e medir cobertura
    # neles distorce o cov gate. Pra rodar:
    #   pytest tests/benchmarks/ --benchmark-only
    "--benchmark-disable",
    # Excluímos tests/benchmarks/ do coverage gate também — são apenas
    # micro-benchmarks de funções já cobertas por outros tests.
    "--ignore=tests/benchmarks",
]

[tool.coverage.run]
source = ["app", "evaluation"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
